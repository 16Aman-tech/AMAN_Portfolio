<section id="about">

    <div class="about-container">

        <div class="about-image">

            <img src="{{ profile.about_image.url }}" alt="{{ profile.name }}">

        </div>

        <div class="about-content">

            <h4>ABOUT ME</h4>

            <h2>{{ profile.role }}</h2>

            <p>

                {{ profile.about_bio }}

            </p>

            <div class="about-info">

                <div>
                    <strong>Name</strong>
                    <span>{{ profile.name }}</span>
                </div>

                <div>
                    <strong>Email</strong>
                    <span>{{ profile.email }}</span>
                </div>

                <div>
                    <strong>Location</strong>
                    <span>{{ profile.location }}</span>
                </div>

                <div>
                    <strong>Phone</strong>
                    <span>{{ profile.phone }}</span>
                </div>

            </div>

        </div>

    </div>

</section>
