<section id="skills">

    <div class="container">

        <div class="section-header">

            <span>MY SKILLS</span>

            <h2>Technologies I Work With</h2>

        </div>

        <div class="skills-grid">

            {% for skill in skills %}

            <div class="skill-card glass">

                {% if skill.icon %}

                <img
                    src="{{ skill.icon.url }}"
                    alt="{{ skill.name }}"
                    class="skill-icon">

                {% endif %}

                <h3>{{ skill.name }}</h3>

                <div class="progress">

                    <div
                        class="progress-fill"
                        data-width="{{ skill.percentage }}"
                        style="width:0%;">
                    </div>

                </div>

                <div class="skill-footer">

                    <span>{{ skill.percentage }}%</span>

                </div>

            </div>

            {% empty %}

            <div class="skill-card glass">

                <h3>No Skills Added Yet</h3>

            </div>

            {% endfor %}

        </div>

    </div>

</section>
